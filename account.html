<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IDK Werkz - Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🐺 IDK Werkz</h1>
        <p>Your Account</p>
    </header>

    <main class="account-container">

        <section class="account-box">

            <h2>👤 Create Account</h2>

            <form id="signup-form">

                <input
                    type="text"
                    id="signup-name"
                    placeholder="Name"
                    required
                >

                <input
                    type="email"
                    id="signup-email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Account Password"
                    required
                >

                <input
                    type="password"
                    id="signup-confirm"
                    placeholder="Confirm Password"
                    required
                >

                <button type="submit" class="buy-button">
                    CREATE ACCOUNT
                </button>

            </form>

        </section>


        <section class="account-box">

            <h2>🔐 Log In</h2>

            <form id="login-form">

                <input
                    type="text"
                    id="login-name"
                    placeholder="Name"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Account Password"
                    required
                >

                <button type="submit" class="buy-button">
                    LOG IN
                </button>

            </form>

            <button
                type="button"
                id="forgot-password"
                class="cart-button">
                Forgot Password?
            </button>

        </section>

    </main>

</body>
</html>
